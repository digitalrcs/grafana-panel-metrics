name: Release review candidate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/download-artifact@v8
        with:
          name: review-package
          path: artifacts
      - name: Attest exact review ZIP
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/*.zip
      - name: Publish immutable unsigned review candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --verify-tag --prerelease \
            --title "Panel Metrics $GITHUB_REF_NAME — initial review candidate" \
            --notes-file docs/RELEASE_NOTES.md
